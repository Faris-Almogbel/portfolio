<style>
:root{--ink:#22160b;--gold:#ffd98a;--paper:#f6ecd8;--accent:#c2416b;--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:var(--sans);--ar:"Readex Pro","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e9d7b0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.ar{font-family:var(--ar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{user-select:none;-webkit-user-drag:none}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
.sky{position:absolute;inset:-2% -6% 0 -6%;background-size:cover;background-position:center 70%;will-change:transform,opacity}
#floor{position:absolute;left:0;right:0;bottom:0;height:22%;background-image:url(assets/floor.webp);background-size:auto 150%;background-repeat:repeat-x;background-blend-mode:multiply;z-index:1}
#floor::before{content:"";position:absolute;left:0;right:0;top:-10px;height:22px;background:inherit;filter:blur(6px);opacity:.9}
#world{position:absolute;inset:0;z-index:2;pointer-events:none}
.it{position:absolute;bottom:0;left:0;will-change:transform;visibility:hidden}
.it>img{display:block;width:100%;height:100%}
.it .dim,.it .lit{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:0}
.it .dim{background:#140f30}
.it .lit{background:radial-gradient(ellipse at 50% 45%,rgba(255,196,110,.85),rgba(255,160,70,.25) 60%,transparent 75%);mix-blend-mode:screen}
.wallseg{position:absolute;bottom:0;left:0;overflow:visible}
.wallseg>.wl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wallseg.dark>.wl{transform:scaleX(-1);filter:brightness(.62) saturate(.9)}
.frame,.tool{position:absolute;pointer-events:auto;cursor:pointer;transition:transform .25s}
.frame:hover,.tool:hover{transform:translateY(-4px)}
.frame img{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.frame .in{position:absolute;left:20%;right:20%;top:17%;bottom:17%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.35em;color:#3a2614}
.frame .n{font-family:var(--serif);font-weight:800;font-size:var(--fs1);line-height:1}
.frame .t{font-size:var(--fs2);line-height:1.25}
.frame .s{font-size:var(--fs3);opacity:.7}
body.ar .frame .t,body.ar .frame .s{font-family:var(--ar)}
.tool img{display:block;width:100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.tool .nm.up{top:auto;bottom:100%;transform:translate(-50%,-8px)}
.tool .nm{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);white-space:nowrap;font-size:12px;font-weight:600;color:#ffe7b5;background:rgba(30,20,10,.72);padding:3px 8px;border-radius:999px}

#me{position:absolute;z-index:4;bottom:4%;left:0;transform-origin:50% 100%;will-change:transform,left;pointer-events:none}
#me img{position:absolute;left:0;bottom:0;display:block;height:100%;width:100%;transform-origin:50% 100%;transform:translateY(var(--bob,0)) rotate(var(--rot,0)) scaleX(var(--dir,1))}
#shadow{position:absolute;left:50%;bottom:-2%;width:70%;height:6%;background:radial-gradient(ellipse,rgba(40,20,0,.38),transparent 70%);transform:translateX(-50%)}

#hero{position:absolute;z-index:5;left:6vw;top:18vh;max-width:min(560px,60vw);pointer-events:none}
#hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(56px,11vw,150px);line-height:.85;letter-spacing:-.02em;color:#fffaf0;text-shadow:0 4px 30px rgba(80,50,10,.35)}
#hero h1 .sur{display:block;font-family:var(--sans);font-weight:700;font-size:clamp(13px,1.5vw,18px);letter-spacing:.55em;margin-top:18px;color:var(--ink);text-shadow:0 0 10px rgba(255,250,236,.9)}
#hero p{margin-top:16px;font-family:var(--sans);font-size:clamp(15px,1.45vw,19px);line-height:1.5;color:var(--ink);font-weight:600;text-shadow:0 0 14px rgba(255,250,236,1),0 0 4px rgba(255,250,236,.95)}
#hero p::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--accent);margin-inline-end:.55em;vertical-align:.08em}
body.ar #hero{direction:rtl;text-align:right}
body.ar #hero h1{font-family:var(--ar);font-weight:800;letter-spacing:0;line-height:1.05}
body.ar #hero h1 .sur{font-family:var(--ar);letter-spacing:.12em}
body.ar #hero p{font-family:var(--ar);font-weight:600;line-height:1.75}

#head{position:absolute;z-index:5;left:6vw;top:12vh;max-width:min(680px,88vw);pointer-events:none;color:var(--ink);transition:opacity .32s ease,filter .32s ease,transform .32s ease}
#head .w{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(34px,5.4vw,78px);line-height:1.04;letter-spacing:-.01em;opacity:0;animation:rise .8s cubic-bezier(.16,.84,.24,1) forwards}
#head .w i,#head .w em{font-style:italic;color:var(--accent)}
#head.sm{top:9vh}
#head.sm .w{font-size:clamp(26px,3.4vw,50px)}
#head .sub{font-family:var(--sans);font-weight:500;font-size:clamp(14px,1.2vw,16px);margin-top:14px;opacity:0;animation:rise .7s cubic-bezier(.16,.84,.24,1) .45s forwards}
body.ar #head{direction:rtl;text-align:right}
body.ar #head .w{font-family:var(--ar);font-weight:700;letter-spacing:0;line-height:1.3}
body.ar #head .w em{font-style:normal}
body.ar #head .sub{font-family:var(--ar)}
.icons{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;pointer-events:auto}
.ic{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;background:rgba(24,16,44,.55);border:1px solid rgba(255,217,138,.45);color:var(--gold);text-decoration:none;font-family:var(--sans);font-weight:600;font-size:14px;opacity:0;animation:rise .6s cubic-bezier(.16,.84,.24,1) forwards;backdrop-filter:blur(4px)}
body.ar .ic{font-family:var(--ar)}
.ic:hover{background:rgba(255,217,138,.2)}
.ic svg{width:17px;height:17px;fill:currentColor}

#cap{position:absolute;z-index:5;pointer-events:none;font-family:var(--sans);font-weight:500;font-size:clamp(14px,1.2vw,16.5px);line-height:1.6;padding:12px 16px;border-radius:14px;background:var(--capbg,rgba(255,248,232,.72));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .32s ease,filter .32s ease,transform .32s ease,background .6s}
#cap:empty{display:none}
#cap .ln{opacity:0;animation:rise .6s cubic-bezier(.16,.84,.24,1) forwards;padding-inline-start:1.1em;position:relative}
#cap .ln::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:.42em;height:.42em;border-radius:50%;background:var(--accent)}
#cap .lh{font-weight:700;margin-bottom:6px;opacity:0;animation:rise .6s cubic-bezier(.16,.84,.24,1) forwards}
body.ar #cap{direction:rtl;font-family:var(--ar);line-height:1.8}
#cap .by{opacity:0;animation:rise .6s forwards;font-size:12.5px;letter-spacing:.04em}
#head.out,#cap.out{opacity:0;filter:blur(6px);transform:translateY(-10px)}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}

#bar{position:absolute;z-index:8;left:16px;top:14px;display:flex;gap:6px}
#bar button{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;font-weight:600;font-size:14px;color:#fffaf0;text-shadow:0 1px 6px rgba(0,0,0,.4);transition:transform .2s}
#bar button:hover{transform:translateY(-2px)}
#bar img{height:38px;width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
#prog{position:absolute;z-index:8;left:0;top:0;height:3px;background:var(--accent);width:0}
#hint{position:absolute;z-index:5;left:0;right:0;bottom:3.5vh;text-align:center;font-size:13px;color:var(--ink);pointer-events:none;transition:opacity .5s}

#load{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#e9d7b0;font-size:14px;transition:opacity .6s}
#load.out{opacity:0;pointer-events:none}

/* map */
#mapv{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 40%,#e2cc9e,#c9ad78);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#mapv.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0}}
#mapv .top{position:sticky;left:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;z-index:3}
#mapv h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:28px}
body.ar #mapv h2{font-family:var(--ar);font-style:normal;font-weight:700}
.pill{padding:10px 18px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);font-weight:600}
#mapc{position:relative;margin:0 auto 30px;filter:drop-shadow(0 18px 30px rgba(60,35,5,.35))}
#mapc .bg{display:block;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
.pin img{display:block;width:100%;filter:drop-shadow(0 6px 6px rgba(50,30,0,.35));transition:transform .25s}
.pin:hover img{transform:translateY(-6px) scale(1.05)}
.plb{position:absolute;transform:translate(-50%,4px);z-index:5;pointer-events:none;opacity:0;animation:fade2 .5s forwards;white-space:nowrap;font-family:var(--serif);font-weight:800;font-size:var(--lb);color:#2a1a0c;text-shadow:0 0 6px #f7ead0,0 0 3px #f7ead0,0 0 12px #f7ead0}
body.ar .plb{font-family:var(--ar);font-weight:700}
.pin .yh{position:absolute;bottom:100%;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;text-shadow:0 0 6px #f7ead0}
.pin.here img{filter:drop-shadow(0 0 14px rgba(255,120,170,.9)) drop-shadow(0 6px 6px rgba(50,30,0,.35))}
@keyframes fade2{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-80%) scale(.6)}to{opacity:1;transform:translate(-50%,-100%)}}

/* modal */
#modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(20,12,4,.55);backdrop-filter:blur(3px);padding:20px}
#modal.on{display:grid;animation:fade .25s}
#card{position:relative;width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--paper);border-radius:18px;padding:28px 26px 24px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
#card h3{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.1;padding-right:40px}
body.ar #card h3{font-family:var(--ar);padding-right:0;padding-left:40px}
#card .m{margin-top:6px;font-size:13px;opacity:.65}
#card .d{margin-top:16px;line-height:1.65;font-size:15px}
#card ul{margin-top:14px;padding-inline-start:20px;line-height:1.8;font-size:15px}
#card .gal{display:grid;gap:10px;margin-top:16px}
#card .gal img{width:100%;border-radius:10px;display:block}
#card a.go{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600}
#card .x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.07);font-size:20px}
body.ar #card .x{right:auto;left:16px}
body.ar #card{direction:rtl}

@media (min-width:700px){#head .w{white-space:nowrap}}
@media (max-width:699px){
  #hero{top:13vh;max-width:70vw}
  #head{top:9vh}
  #bar img{height:32px}
}
@media (prefers-reduced-motion:reduce){
  #head .w,#cap .ln,.ic,.pin{animation-duration:.01s}
}
</style>

  var T=DATA.ui[lang];document.documentElement.lang=lang;document.body.classList.toggle("ar",lang=="ar");
  $("h1").innerHTML="";$("h1").appendChild(document.createTextNode(T.name));var su=mk("span","sur",$("h1"));su.textContent=T.sur;
  $("t1").textContent=T.t1;$("t2").textContent=T.t2;$("hint").textContent=T.hint;$("langl").textContent=T.lang;$("mapl").textContent=T.map;
  $("load").textContent=T.loading;fillText();cur="";
  if($("mapv").classList.contains("on"))openMap();
}
$("lang").onclick=function(){lang=lang=="en"?"ar":"en";try{localStorage.setItem("fa_lang",lang)}catch(e){}applyLang()};

/* ---------- input ---------- */
var drag=false,lx=0,dx0=0,dy0=0;
stage.addEventListener("pointerdown",function(e){drag=true;lx=dx0=e.clientX;dy0=e.clientY;stage.classList.add("drag");try{stage.setPointerCapture(e.pointerId)}catch(x){}});
stage.addEventListener("pointermove",function(e){if(!drag)return;var dx=e.clientX-lx;lx=e.clientX;go(target-dx*1.4)});
function up(e){var was=drag;drag=false;stage.classList.remove("drag");
  if(was&&e.type=="pointerup"&&Math.abs(e.clientX-dx0)<6&&Math.abs(e.clientY-dy0)<6){
    var el=document.elementFromPoint(e.clientX,e.clientY),f=el&&el.closest(".frame"),tl=el&&el.closest(".tool");
    if(f)openCert(+f.dataset.i);else if(tl)openProj(+tl.dataset.i);
  }}
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
stage.addEventListener("keydown",function(e){if(e.key=="Enter"||e.key==" "){var f=e.target.closest(".frame"),tl=e.target.closest(".tool");if(f)openCert(+f.dataset.i);if(tl)openProj(+tl.dataset.i)}});
addEventListener("wheel",function(e){if($("mapv").classList.contains("on")||$("modal").classList.contains("on"))return;e.preventDefault();go(target+(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.1)},{passive:false});
addEventListener("keydown",function(e){
  if(e.key=="Escape"){if($("modal").classList.contains("on"))closeModal();else if($("mapv").classList.contains("on"))closeMap();return}
  if($("mapv").classList.contains("on")||$("modal").classList.contains("on"))return;
  if(e.key=="ArrowRight"||e.key=="ArrowDown"||e.key=="PageDown"){e.preventDefault();go(target+W*.18)}
  else if(e.key=="ArrowLeft"||e.key=="ArrowUp"||e.key=="PageUp"){e.preventDefault();go(target-W*.18)}
  else if(e.key=="Home")go(0);else if(e.key=="End")go(maxP);
});
var rz=0;addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){var f=maxP?pos/maxP:0;build();pos=target=f*maxP;if($("mapv").classList.contains("on"))openMap()},140)});

/* ---------- boot ---------- */
function ready(){
  ["sky-day","sky-sunset","sky-night"].forEach(function(s,i){$("sk"+i).style.backgroundImage="url(assets/"+s+".webp)"});
  build();applyLang();
  var m=(location.hash||"").match(/at=(\w+)/);
  if(m){var s=STOPS.filter(function(z){return z.id==m[1]})[0];if(s)pos=target=s.p}
  requestAnimationFrame(update);$("load").classList.add("out");
}
var cnt=0;
IMGS.forEach(function(s){var im=new Image();im.onload=function(){R[s]={w:im.naturalWidth,h:im.naturalHeight};if(++cnt==IMGS.length)ready()};im.onerror=function(){R[s]={w:1,h:1};if(++cnt==IMGS.length)ready()};im.src="assets/"+s+".webp"});
})();
</script>
</body>
