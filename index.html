<style>
:root{--ink:#22160b;--gold:#ffd98a;--paper:#f6ecd8;--accent:#c2416b;--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:var(--sans);--ar:"Readex Pro","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e9d7b0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.ar{font-family:var(--ar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{user-select:none;-webkit-user-drag:none}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
.sky{position:absolute;inset:-2% -6% 0 -6%;background-size:cover;background-position:center 70%;will-change:transform,opacity}
#floor{position:absolute;left:0;right:0;bottom:0;height:22%;background-image:url(assets/floor.webp);background-size:auto 150%;background-repeat:repeat-x;background-blend-mode:multiply;z-index:1}
#floor::before{content:"";position:absolute;left:0;right:0;top:-10px;height:22px;background:inherit;filter:blur(6px);opacity:.9}
#world{position:absolute;inset:0;z-index:2;pointer-events:none}
.it{position:absolute;bottom:0;left:0;will-change:transform;visibility:hidden}
.it>img{display:block;width:100%;height:100%}
.it .dim,.it .lit{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:0}
.it .dim{background:#140f30}
.it .lit{background:radial-gradient(ellipse at 50% 45%,rgba(255,196,110,.85),rgba(255,160,70,.25) 60%,transparent 75%);mix-blend-mode:screen}
.wallseg{position:absolute;bottom:0;left:0;overflow:visible}
.wallseg>.wl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wallseg.sk>.wl{filter:brightness(.88) saturate(.95) hue-rotate(-6deg)}
.skw{position:absolute;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;user-select:none}
.skr{display:flex;flex-direction:column;gap:.5em}
.skg{font-family:var(--sans);font-weight:700;font-size:var(--skg);letter-spacing:.16em;text-transform:uppercase;color:#7b4e2a;opacity:.85;mix-blend-mode:multiply;display:flex;align-items:center;gap:.8em}
.skg::before,.skg::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.skw.c{justify-content:space-evenly}
.skw.c .ski{flex-wrap:wrap;row-gap:5px}
.skw.c .sk{flex-basis:25%;gap:.2em}
.skw.c .skr{gap:.3em}
.skw.c .skg{font-size:9.5px}
body.ar .skg{text-transform:none;font-family:var(--ar);letter-spacing:0;font-size:calc(var(--skg)*1.2)}
body.ar .skw{direction:rtl}
.ski{display:flex;flex-wrap:nowrap;gap:0;justify-content:center}
.sk{flex:0 0 calc(100%/7);min-width:0;display:flex;flex-direction:column;align-items:center;gap:.45em;text-align:center}
.sk svg{width:var(--sks);height:var(--sks);mix-blend-mode:multiply;opacity:.9;filter:drop-shadow(0 1px 0 rgba(255,255,255,.35))}
.sk span{font-family:var(--sans);font-weight:600;font-size:var(--skn);line-height:1.15;color:#3a2614;mix-blend-mode:multiply;opacity:.88;direction:ltr}
.wallseg.dark>.wl{transform:scaleX(-1);filter:brightness(.62) saturate(.9)}
.frame,.tool{position:absolute;pointer-events:auto;cursor:pointer;transition:transform .25s}
.frame:hover,.tool:hover{transform:translateY(-4px)}
.frame img{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.frame .in{position:absolute;left:20%;right:20%;top:17%;bottom:17%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.35em;color:#3a2614}
.frame .n{font-family:var(--serif);font-weight:800;font-size:var(--fs1);line-height:1}
.frame .t{font-size:var(--fs2);line-height:1.25}
.frame .s{font-size:var(--fs3);opacity:.7}
body.ar .frame .t,body.ar .frame .s{font-family:var(--ar)}
.tool img{display:block;width:100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.tool .nm.up{top:auto;bottom:100%;transform:translate(-50%,-8px)}
.tool .nm{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);white-space:nowrap;font-size:12px;font-weight:600;color:#ffe7b5;background:rgba(30,20,10,.72);padding:3px 8px;border-radius:999px}

#me{position:absolute;z-index:4;bottom:4%;left:0;transform-origin:50% 100%;will-change:transform,left;pointer-events:none}
#me img{transition:opacity .07s linear;position:absolute;left:0;bottom:0;display:block;height:100%;width:100%;transform-origin:50% 100%;transform:translateY(var(--bob,0)) rotate(var(--rot,0)) scaleX(var(--dir,1))}
#shadow{position:absolute;left:50%;bottom:-2%;width:70%;height:6%;background:radial-gradient(ellipse,rgba(40,20,0,.38),transparent 70%);transform:translateX(-50%)}

#hero{position:absolute;z-index:5;left:6vw;top:18vh;max-width:min(560px,60vw);pointer-events:none}
#hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(56px,11vw,150px);line-height:.85;letter-spacing:-.02em;color:#fffaf0;text-shadow:0 4px 30px rgba(80,50,10,.35)}
#hero h1 .sur{display:block;font-family:var(--sans);font-weight:700;font-size:clamp(13px,1.5vw,18px);letter-spacing:.55em;margin-top:18px;color:var(--ink);text-shadow:0 0 10px rgba(255,250,236,.9)}
#hero p{margin-top:16px;font-family:var(--sans);font-size:clamp(15px,1.45vw,19px);line-height:1.5;color:var(--ink);font-weight:600;text-shadow:0 0 14px rgba(255,250,236,1),0 0 4px rgba(255,250,236,.95)}
#hero p::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--accent);margin-inline-end:.55em;vertical-align:.08em}
body.ar #hero{direction:rtl;text-align:right}
body.ar #hero h1{font-family:var(--ar);font-weight:800;letter-spacing:0;line-height:1.05}
body.ar #hero h1 .sur{font-family:var(--ar);letter-spacing:.12em}
body.ar #hero p{font-family:var(--ar);font-weight:600;line-height:1.75}

#head{position:absolute;z-index:5;left:6vw;top:12vh;max-width:min(680px,88vw);pointer-events:none;color:var(--ink);transition:opacity .32s ease,filter .32s ease,transform .32s ease}
#head .w{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(34px,5.4vw,78px);line-height:1.04;letter-spacing:-.01em;opacity:0;animation:rise .8s cubic-bezier(.16,.84,.24,1) forwards}
#head .w i,#head .w em{font-style:italic;color:var(--accent)}
#head.sm{top:9vh}
#head.sm .w{font-size:clamp(26px,3.4vw,50px)}
#head .sub{font-family:var(--sans);font-weight:500;font-size:clamp(14px,1.2vw,16px);margin-top:14px;opacity:0;animation:rise .7s cubic-bezier(.16,.84,.24,1) .45s forwards}
body.ar #head{direction:rtl;text-align:right}
body.ar #head .w{font-family:var(--ar);font-weight:700;letter-spacing:0;line-height:1.3}
body.ar #head .w em{font-style:normal}
body.ar #head .sub{font-family:var(--ar)}
.icons{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;pointer-events:auto}
.ic{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;background:rgba(24,16,44,.55);border:1px solid rgba(255,217,138,.45);color:var(--gold);text-decoration:none;font-family:var(--sans);font-weight:600;font-size:14px;opacity:0;animation:rise .6s cubic-bezier(.16,.84,.24,1) forwards;backdrop-filter:blur(4px)}
body.ar .ic{font-family:var(--ar)}
.ic:hover{background:rgba(255,217,138,.2)}
.ic svg{width:17px;height:17px;fill:currentColor}

#cap{position:absolute;z-index:5;pointer-events:none;font-family:var(--sans);font-weight:500;font-size:clamp(14px,1.2vw,16.5px);line-height:1.6;padding:12px 16px;border-radius:14px;background:var(--capbg,rgba(255,248,232,.72));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .32s ease,filter .32s ease,transform .32s ease,background .6s}
#cap:empty{display:none}
#cap .ln{opacity:0;animation:rise .6s cubic-bezier(.16,.84,.24,1) forwards;padding-inline-start:1.1em;position:relative}
#cap .ln::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:.42em;height:.42em;border-radius:50%;background:var(--accent)}
#cap .ln.meta{padding-inline-start:0;font-weight:700;font-size:.82em;letter-spacing:.06em;text-transform:uppercase;color:var(--capk);margin-bottom:4px}
#cap .ln.meta::before{display:none}
body.ar #cap .ln.meta{letter-spacing:0;font-size:.9em}
#cap.bld{font-size:clamp(15px,1.25vw,18px);box-shadow:0 10px 30px -12px rgba(60,30,10,.35);border:1px solid var(--capbd,rgba(160,110,60,.18));padding:14px 20px 16px}
#cap .lh{font-weight:700;margin-bottom:6px;opacity:0;animation:rise .6s cubic-bezier(.16,.84,.24,1) forwards}
body.ar #cap{direction:rtl;font-family:var(--ar);line-height:1.8}
#cap .by{opacity:0;animation:rise .6s forwards;font-size:12.5px;letter-spacing:.04em}
#head.out,#cap.out{opacity:0;filter:blur(6px);transform:translateY(-10px)}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}

#bar{position:absolute;z-index:8;left:16px;top:14px;display:flex;gap:6px}
#bar button{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:999px;font-weight:600;font-size:14px;color:#fffaf0;text-shadow:0 1px 6px rgba(0,0,0,.4);transition:transform .2s}
#bar button:hover{transform:translateY(-2px)}
#bar img{height:38px;width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
#prog{position:absolute;z-index:8;left:0;top:0;height:3px;background:var(--accent);width:0}
#hint{position:absolute;z-index:5;left:0;right:0;bottom:3.5vh;text-align:center;font-size:13px;color:var(--ink);pointer-events:none;transition:opacity .5s}

#load{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#e9d7b0;font-size:14px;transition:opacity .6s}
#load.out{opacity:0;pointer-events:none}

/* map */
#mapv{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 40%,#e2cc9e,#c9ad78);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#mapv.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0}}
#mapv .top{position:sticky;left:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;z-index:3}
#mapv h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:28px}
body.ar #mapv h2{font-family:var(--ar);font-style:normal;font-weight:700}
.pill{padding:10px 18px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);font-weight:600}
#mapc{position:relative;margin:0 auto 30px;filter:drop-shadow(0 18px 30px rgba(60,35,5,.35))}
#mapc .bg{display:block;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
.pin img{display:block;width:100%;filter:drop-shadow(0 6px 6px rgba(50,30,0,.35));transition:transform .25s}
.pin:hover img{transform:translateY(-6px) scale(1.05)}
.plb{position:absolute;transform:translate(-50%,4px);z-index:5;pointer-events:none;opacity:0;animation:fade2 .5s forwards;white-space:nowrap;font-family:var(--serif);font-weight:800;font-size:var(--lb);color:#2a1a0c;text-shadow:0 0 6px #f7ead0,0 0 3px #f7ead0,0 0 12px #f7ead0}
body.ar .plb{font-family:var(--ar);font-weight:700}
.pin .yh{position:absolute;bottom:100%;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;text-shadow:0 0 6px #f7ead0}
.pin.here img{filter:drop-shadow(0 0 14px rgba(255,120,170,.9)) drop-shadow(0 6px 6px rgba(50,30,0,.35))}
@keyframes fade2{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-80%) scale(.6)}to{opacity:1;transform:translate(-50%,-100%)}}

/* modal */
#modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(20,12,4,.55);backdrop-filter:blur(3px);padding:20px}
#modal.on{display:grid;animation:fade .25s}
#card{position:relative;width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--paper);border-radius:18px;padding:28px 26px 24px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
#card h3{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.1;padding-right:40px}
body.ar #card h3{font-family:var(--ar);padding-right:0;padding-left:40px}
#card .m{margin-top:6px;font-size:13px;opacity:.65}
#card .d{margin-top:16px;line-height:1.65;font-size:15px}
#card ul{margin-top:14px;padding-inline-start:20px;line-height:1.8;font-size:15px}
#card .gal{display:grid;gap:10px;margin-top:16px}
#card .gal img{width:100%;border-radius:10px;display:block}
#card a.go{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600}
#card .x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.07);font-size:20px}
body.ar #card .x{right:auto;left:16px}
body.ar #card{direction:rtl}

@media (min-width:700px){#head .w{white-space:nowrap}}
@media (max-width:699px){
  #hero{top:13vh;max-width:70vw}
  #head{top:9vh}
  #bar img{height:32px}
}
@media (prefers-reduced-motion:reduce){
  #head .w,#cap .ln,.ic,.pin{animation-duration:.01s}
}
</style>
</head>

   d:{en:"An internal file-sharing solution that generates unique links and QR codes so files reach only the intended recipients. I built the QR code generation with custom code and a Power BI dashboard that tracks sharing activity across departments, internal and external.",
      ar:"حل داخلي لمشاركة الملفات يولّد روابط ورموز QR خاصة عشان الملف يوصل للشخص المقصود بس. بنيت توليد رموز QR بكود مخصص، ولوحة Power BI تتابع نشاط المشاركة بين الإدارات داخلياً وخارجياً."},

  {img:"p_washroom",n:"Smart Washroom Dashboard",m:{en:"Next.js · PHP · JavaScript · Webhooks · IoT sensors",ar:"Next.js · PHP · JavaScript · Webhooks · حساسات IoT"},
   d:{en:"An IoT dashboard for smart washroom sensors. I wrote the backend logic that validates, classifies and stores sensor data, and built responsive dashboard screens with real-time updates through webhooks.",

   d:{en:"A native Windows app that reads the meetings from your Outlook calendar and shows a live countdown for the meeting in progress: green, then amber at 15 minutes and red at 5. It lists the next meetings, hides the titles of private ones, and has a full-screen room-display mode for meeting rooms.",
      ar:"تطبيق ويندوز يسحب الاجتماعات من تقويم Outlook حقك ويعرض عدّاد تنازلي مباشر للاجتماع الحالي: أخضر، ثم برتقالي إذا بقى 15 دقيقة، وأحمر إذا بقى 5. يعرض الاجتماعات الجاية، ويخفي عناوين الاجتماعات الخاصة، وفيه وضع شاشة كاملة لقاعات الاجتماعات."},

        var tb_=mk("img","",seg);tb_.src="assets/table.webp";tb_.style.cssText="position:absolute;left:"+tl+"px;bottom:"+tb+"px;width:"+tw+"px;height:"+th+"px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))";
        var vis=DATA.projects.filter(function(p){return !p.hidden}),n=vis.length,topY=tb+th*.93,oh=H*.15;
        vis.forEach(function(p,k){
          var t=mk("div","tool",seg),w=oh/ratio(p.img);
          t.dataset.i=DATA.projects.indexOf(p);
          t.style.cssText="left:"+(tl+tw*(k+1)/(n+1)-w/2)+"px;bottom:"+topY+"px;width:"+w+"px";
          mk("img","",t).src="assets/"+p.img+".webp";var nm=mk("div","nm"+(!mob&&n>2&&k==Math.floor(n/2)?" up":""),t);nm.textContent=p.n;
          t.setAttribute("role","button");t.tabIndex=0;t.setAttribute("aria-label",p.n);toolEls.push(t);
        });
        s.tblTop=topY;
      }
      s.x0=x;s.x1=x+ww;s.cx=x+ww/2;x+=ww;

  STOPS.forEach(function(s){s.p=s.cx-W*(!mob&&(s.type=="building"||s.type=="skills")?(s.type=="skills"?.6:.62):.5);s.r=Math.max((s.x1-s.x0)/2,W*.3)+W*.12});
  maxP=STOPS[STOPS.length-1].p;

}

var skLabels=[];
function skillWall(seg,ww){

  skLabels=[];
  // seg-local coords; the stop's camera puts the wall centre at W*.6 on desktop, W*.5 on mobile

  var half=Math.min(ww*.42,ww/2-charR),L=ww/2-half,R=ww/2+half,top=H*.405,bot=H*.86,compact=mob||R-L<460;

  L-=off;R-=off;

  var box=mk("div","skw"+(compact?" c":""),seg);
  box.style.cssText="left:"+(off+L)+"px;top:"+top+"px;width:"+(R-L)+"px;height:"+(bot-top)+"px;--sks:"+sks+"px;--skn:"+(compact?10.5:Math.max(9.5,Math.min(14,sks*.34)))+"px;--skg:"+Math.max(9.5,Math.min(12.5,sks*.3))+"px";
  DATA.skills.forEach(function(g){

      d.lastChild.textContent=ic.t;
    });
      });
  box.setAttribute("aria-label",DATA.skills.map(function(g){return g.items.map(function(k){return DATA.icons[k].t}).join(", ")}).join("; "));
}

function fillText(){
  skLabels.forEach(function(a){a[0].textContent=a[1][lang]});
  frameEls.forEach(function(f,i){var c=DATA.certs[i];f.querySelector(".in").innerHTML='<div class="n">'+c.n[lang]+'</div><div class="t">'+c.t[lang]+'</div><div class="s">'+c.s[lang]+'</div>';f.setAttribute("aria-label",c.n[lang]+" · "+c.t[lang])});
}

function hex(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
function mix(a,b,t){a=hex(a);b=hex(b);return"rgb("+[0,1,2].map(function(i){return Math.round(a[i]+(b[i]-a[i])*t)}).join(",")+")"}
function ease(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}

function blend(p){
  var s=[{p:0,sky:0,floor:"#fff1d6",night:0}].concat(STOPS),i=0;
  for(;i<s.length-1;i++){if(p<=s[i+1].p)break}
  var A=s[i],B=s[Math.min(i+1,s.length-1)],span=(B.p-A.p)||1,t=ease(((p-A.p)/span-.2)/.6);
  return{A:A,B:B,t:t};
}
function zoneAt(p){
  // text shows only when you've (nearly) arrived: a short window around each stop
  var best=null,bd=1e9,near=Math.max(W*(mob?.22:.13),70);
  STOPS.forEach(function(s){
    var d=p-s.p,inside=s.type=="wall"||s.type=="skills"||s.type=="bench",lo=near*(inside?1.5:1),hi=s.hl2?Math.max(near*2.2,W*.24):lo;
    if(d>-lo&&d<hi&&Math.abs(d)<bd){bd=Math.abs(d);best=s}
  });return best}

var txTimer=0,txHas=false;
function setText(z,pg){
  var key=z?z.id+lang+pg:"none"+lang;if(key===cur)return;cur=key;
  var h=$("head"),c=$("cap");
  clearTimeout(txTimer);
  if(txHas){h.classList.add("out");c.classList.add("out");txTimer=setTimeout(function(){fillZone(z,pg)},300)}
  else fillZone(z,pg);
}
function fillZone(z,pg){
  var h=$("head"),c=$("cap");h.innerHTML="";c.innerHTML="";
  h.classList.remove("out");c.classList.remove("out");
  h.classList.toggle("sm",!!(z&&(z.type=="wall"||z.type=="bench"||z.type=="skills")));
  txHas=!!z;
  if(!z)return;
  var T=DATA.ui[lang];
  ((pg&&z.hl2)?z.hl2:z.hl)[lang].forEach(function(t,i){var s=mk("span","w",h);s.style.animationDelay=(i*.12)+"s";s.innerHTML=t});

    var C=DATA.contact,ic=mk("div","icons",h);
    [["mailto:"+C.email,ICON.mail,T.email],["tel:"+C.phone,ICON.phone,C.phoneLabel],[C.linkedin,ICON.li,"LinkedIn"],[C.github,ICON.code,"GitHub"]].forEach(function(a,k){
      var e=mk("a","ic",ic);e.href=a[0];if(a[0].indexOf("http")==0){e.target="_blank";e.rel="noopener"}
      e.style.animationDelay=(.5+k*.1)+"s";e.innerHTML=a[1]+"<span></span>";e.lastChild.textContent=a[2];if(a[2]==C.phoneLabel)e.lastChild.dir="ltr";
    });
    var by=mk("div","by",c);by.textContent=T.by;by.style.animationDelay="1s";
  }else{
    if(z.lnh){var lh=mk("div","lh",c);lh.textContent=z.lnh[lang];lh.style.animationDelay=".35s"}
    var L=z.ln[lang][Math.min(pg,z.ln[lang].length-1)]||[];
    L.forEach(function(t,i){var d=mk("div","ln"+(z.type=="building"&&pg==0&&i==0?" meta":""),c);d.style.animationDelay=(.4+i*.14)+"s";d.textContent=t});
  }

}
function layoutCap(z){
  var c=$("cap").style,h=$("head");c.left=c.right=c.top=c.bottom="";c.maxWidth="";c.textAlign="";
  $("cap").classList.toggle("bld",!!(z&&z.type=="building"));
  var ar=lang=="ar";

    c.left="6vw";c.right="6vw";c.top=(h.offsetTop+h.offsetHeight+14)+"px";return;
  }

  // buildings: a clear panel right under the headline, left of the building

function update(t){
  requestAnimationFrame(update);
  var dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  var d=target-pos,ad=Math.abs(d);
  // walking pace: ease in/out, capped speed so the legs can keep up (far jumps go a bit faster)
  var want=(d<0?-1:1)*Math.min(ad*5,Math.max(W*1.1,ad*.9));vel+=(want-vel)*Math.min(1,dt*8);
  pos+=vel*dt;if((target-pos)*d<=0||ad<.3){pos=target;vel=0}
  var moving=Math.abs(d)>1.5;
  for(var i=0;i<els.length;i++){var it=els[i],sx=it.x-pos,v=sx<W+60&&sx+it.w>-60;if(v!==it.v){it.v=v;it.el.style.visibility=v?"visible":"hidden"}if(v)it.el.style.transform="translate3d("+sx+"px,0,0)"}
  var b=blend(pos),w=[0,0,0];w[b.A.sky]+=1-b.t;w[b.B.sky]+=b.t;
  $("sk1").style.opacity=w[1];$("sk2").style.opacity=w[2];
  var px=-(pos/Math.max(1,maxP))*W*.05;
  ["sk0","sk1","sk2"].forEach(function(k){$(k).style.transform="translate3d("+px+"px,0,0)"});
  $("floor").style.backgroundColor=mix(b.A.floor,b.B.floor,b.t);
  $("floor").style.backgroundPosition=(-pos)+"px 40%";
  var n=b.A.night*(1-b.t)+b.B.night*b.t;
  if(Math.abs(n-nightV)>.01){nightV=n;
    els.forEach(function(it){if(it.dim)it.dim.style.opacity=.42*n;if(it.lit)it.lit.style.opacity=.55*n});
    meimg.style.filter=mewalk.style.filter="brightness("+(1-.18*n)+")";
    var ink=mix("#22160b","#ffd98a",ease((n-.3)/.5));$("head").style.color=ink;$("cap").style.color=ink;$("hint").style.color=ink;
    var glow=n>.5?"0 0 18px rgba(255,180,80,.45), 0 1px 3px rgba(0,0,0,.6)":"0 0 14px rgba(255,248,230,.95), 0 0 4px rgba(255,248,230,.9)";
    $("cap").style.textShadow=n>.5?"none":"0 0 8px rgba(255,250,236,.6)";
    var cs=$("cap").style;cs.setProperty("--capbg",n>.5?"rgba(24,19,48,.72)":"rgba(255,249,236,.86)");cs.setProperty("--capk",n>.5?"#ffb38a":"#c2416b");cs.setProperty("--capbd",n>.5?"rgba(255,200,140,.18)":"rgba(160,110,60,.2)");$("head").style.textShadow=n>.5?"0 0 26px rgba(255,180,80,.4)":"0 0 18px rgba(255,250,235,.8)";
  }
  // intro → walk → end
  var e=ease(pos/(W*.7));
  $("hero").style.opacity=Math.max(0,1-e*1.8);
  var z=e<.8?null:zoneAt(pos),pg=0;
  if(z&&z.hl2)pg=pos>z.p+Math.max(W*.05,Math.max(W*(mob?.22:.13),70)*.6)?1:0;
  setText(z,pg);
  $("prog").style.width=(pos/maxP*100)+"%";
  var eE=ease((pos-(maxP-W*.6))/(W*.55));
  var inside=STOPS.filter(function(s){return s.type=="wall"||s.type=="bench"||s.type=="skills"}),ins=0;
  if(inside.length){var a=inside[0],bb=inside[inside.length-1];ins=ease((pos-(a.p-W*.45))/(W*.35))*ease((bb.p+W*.5-pos)/(W*.35))}
  var hx=heroX,gxB=hx+(gx-hx)*e,endX=mob?W*.74:W*.68,x=gxB+(endX-gxB)*eE;
  var k=(heroK+(1-heroK)*e)*(1+.22*eE)*(1-.08*ins);
  me.style.left=x+"px";
  // natural two-frame walk, driven by distance travelled so the feet don't slide
  // one cycle = one step: stride (feet apart, body low) → passing (feet together, body high)
  var stepLen=gh*.27*k,moved=Math.abs(pos-lastPos);lastPos=pos;
  if(moving){walkP+=Math.min(dt*2.7,moved/stepLen);idleT=0}else{idleT+=dt}
  var fr=walkP%1,striding=moving&&fr<.55,by,rot;
  if(moving){by=-gh*.011*(.5-.5*Math.cos(2*Math.PI*(fr-.275)));rot=.6+.5*Math.sin(2*Math.PI*fr)}
  else{by=Math.sin(t/1000*1.6)*gh*.002;rot=0;walkP=0}
  meimg.style.opacity=striding?0:1;mewalk.style.opacity=striding?1:0;
  var dir=target<pos-.5?-1:1;if(!moving)dir=+(me.dataset.dir||1);me.dataset.dir=dir;
  me.style.setProperty("--bob",by+"px");me.style.setProperty("--rot",(rot*dir)+"deg");me.style.setProperty("--dir",dir);
  me.style.transform="translateX(-50%) scale("+k+")";
  $("shadow").style.transform="translateX(-50%) scaleX("+(striding?1.08:1)+")";
  $("hint").style.opacity=pos>60?0:.85;
}

function go(p){target=Math.max(0,Math.min(maxP,p))}

/* ---------- modal ---------- */
var lastFocus=null;
function openModal(o){
  lastFocus=document.activeElement;
  $("ct").textContent=o.t;$("cm").textContent=o.m||"";$("cd").textContent=o.d||"";$("cd").style.display=o.d?"":"none";
  $("cl").innerHTML="";(o.list||[]).forEach(function(x){mk("li","",$("cl")).textContent=x});$("cl").style.display=(o.list&&o.list.length)?"":"none";
  $("cg").innerHTML="";(o.images||[]).forEach(function(s){var im=mk("img","",$("cg"));im.src=s;im.alt=o.t;im.loading="lazy"});
  var a=$("ca");if(o.link){a.href=o.link;a.textContent=DATA.ui[lang].open;a.style.display=""}else a.style.display="none";
  $("modal").classList.add("on");$("cx").focus();
}

$("cx").onclick=closeModal;$("modal").onclick=function(e){if(e.target===$("modal"))closeModal()};
$("modal").addEventListener("keydown",function(e){if(e.key=="Tab"){var f=[].slice.call($("card").querySelectorAll("button,a[href]")).filter(function(x){return x.offsetParent});if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

/* ---------- map ---------- */
function openMap(){
  var T=DATA.ui[lang],c=$("mapc");c.innerHTML="";
  $("mh").textContent=T.route;$("mapx").textContent=T.close;
  var vw=innerWidth,ar=ratio("map"),mw,mh;
  if(vw<700){mh=Math.max(330,Math.min(innerHeight-120,560));mw=mh/ar;c.style.margin="0 0 20px"}
  else{mw=Math.min(1180,vw-48,(innerHeight-110)/ar);mh=mw*ar;c.style.margin="0 auto 30px"}
  c.style.width=mw+"px";c.style.height=mh+"px";c.style.setProperty("--lb",Math.max(12,Math.min(19,mw*.016))+"px");
  var bg=mk("img","bg",c);bg.src="assets/map.webp";bg.alt="";
  var all=[{name:T.start,p:0,img:"me"}].concat(STOPS.filter(function(s){return !s.nomap}).map(function(s){return{name:s.name[lang],p:s.p,img:s.map}}));
  var here=0;all.forEach(function(a,i){if(a.p<=target+W*.3)here=i});
  all.forEach(function(a,i){
    var pt=DATA.mapPts[i],b=mk("button","pin"+(i==here?" here":""),c);
    var w=i==0?mw*.03:mw*.095;b.style.width=w+"px";b.style.left=(pt[0]*mw)+"px";b.style.top=(pt[1]*mh)+"px";
    b.style.animationDelay=(.1+i*.09)+"s";b.setAttribute("aria-label",a.name);
    if(i==here){var y=mk("span","yh",b);y.textContent=T.here}
    var im=mk("img","",b);im.src="assets/"+a.img+".webp";im.alt="";
    var l=mk("span","plb",c);l.textContent=a.name;l.style.left=(pt[0]*mw)+"px";l.style.top=(pt[1]*mh)+"px";l.style.animationDelay=(.3+i*.09)+"s";
    b.onclick=function(){closeMap();go(a.p)};
  });
  $("mapv").classList.add("on");
  $("mapv").scrollLeft=vw<700?Math.max(0,DATA.mapPts[here][0]*mw-vw/2):0;
  $("mapx").focus();
}
function closeMap(){$("mapv").classList.remove("on");$("mapb").focus()}
$("mapb").onclick=openMap;$("mapx").onclick=closeMap;

/* ---------- language ---------- */
function applyLang(){

  $("h1").innerHTML="";$("h1").appendChild(document.createTextNode(T.name));var su=mk("span","sur",$("h1"));su.textContent=T.sur;

$("lang").onclick=function(){lang=lang=="en"?"ar":"en";try{localStorage.setItem("fa_lang",lang)}catch(e){}applyLang()};

/* ---------- input ---------- */
var drag=false,lx=0,dx0=0,dy0=0;
stage.addEventListener("pointerdown",function(e){drag=true;lx=dx0=e.clientX;dy0=e.clientY;stage.classList.add("drag");try{stage.setPointerCapture(e.pointerId)}catch(x){}});
stage.addEventListener("pointermove",function(e){if(!drag)return;var dx=e.clientX-lx;lx=e.clientX;go(target-dx*1.4)});
function up(e){var was=drag;drag=false;stage.classList.remove("drag");
  if(was&&e.type=="pointerup"&&Math.abs(e.clientX-dx0)<6&&Math.abs(e.clientY-dy0)<6){
    var el=document.elementFromPoint(e.clientX,e.clientY),f=el&&el.closest(".frame"),tl=el&&el.closest(".tool");
    if(f)openCert(+f.dataset.i);else if(tl)openProj(+tl.dataset.i);
  }}
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
stage.addEventListener("keydown",function(e){if(e.key=="Enter"||e.key==" "){var f=e.target.closest(".frame"),tl=e.target.closest(".tool");if(f)openCert(+f.dataset.i);if(tl)openProj(+tl.dataset.i)}});
addEventListener("wheel",function(e){if($("mapv").classList.contains("on")||$("modal").classList.contains("on"))return;e.preventDefault();go(target+(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.1)},{passive:false});
addEventListener("keydown",function(e){
  if(e.key=="Escape"){if($("modal").classList.contains("on"))closeModal();else if($("mapv").classList.contains("on"))closeMap();return}
  if($("mapv").classList.contains("on")||$("modal").classList.contains("on"))return;
  if(e.key=="ArrowRight"||e.key=="ArrowDown"||e.key=="PageDown"){e.preventDefault();go(target+W*.18)}
  else if(e.key=="ArrowLeft"||e.key=="ArrowUp"||e.key=="PageUp"){e.preventDefault();go(target-W*.18)}
  else if(e.key=="Home")go(0);else if(e.key=="End")go(maxP);
});
var rz=0;addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){var f=maxP?pos/maxP:0;build();pos=target=f*maxP;if($("mapv").classList.contains("on"))openMap()},140)});

/* ---------- boot ---------- */
function ready(){
  ["sky-day","sky-sunset","sky-night"].forEach(function(s,i){$("sk"+i).style.backgroundImage="url(assets/"+s+".webp)"});
  build();applyLang();
  var m=(location.hash||"").match(/at=(\w+)/);
  if(m){var s=STOPS.filter(function(z){return z.id==m[1]})[0];if(s)pos=target=s.p}
  requestAnimationFrame(update);$("load").classList.add("out");
}
var cnt=0;
IMGS.forEach(function(s){var im=new Image();im.onload=function(){R[s]={w:im.naturalWidth,h:im.naturalHeight};if(++cnt==IMGS.length)ready()};im.onerror=function(){R[s]={w:1,h:1};if(++cnt==IMGS.length)ready()};im.src="assets/"+s+".webp"});
})();
</script>
